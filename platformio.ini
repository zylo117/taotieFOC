; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

;[platformio]
;src_dir = .

[env:genericAT32F403ACCT7]
platform = arterytekat32
board = genericAT32F403ACCT7
framework = at32firmlib
build_flags =
    -DARM_MATH_CM4=1
    -D__FPU_PRESENT=1U
    ; 【诊断开关】取消注释即可完全绕过磁编码器非线性校准表，
    ; 用来判定“周期性跟随误差”是不是校准表引入的（同一份固件只改这一行）。
    ; -DDISABLE_ENCODER_CALIBRATION_TABLE
    -Iinclude
    -mcpu=cortex-m4
    -mfpu=fpv4-sp-d16
    -mfloat-abi=hard
    -O3
; 启用printf浮点支持
    -Wl,-u,_printf_float
; 如需scanf读取浮点数再加这一条
; -Wl,-u,_scanf_float

; ===== STEP 脉冲时序（src/closed_loop_controller.cpp 顶部有完整说明）=====
; 0 = 恒速突发（原方案，每窗脉冲挤在窗口开头一波打完）
; 1 = 平滑铺满（本窗步数均匀铺到整窗，降噪主力，无副作用）
; 2 = 平滑 + 谐波注入（在 1 基础上对步频做正弦调频，需先调 f_h/depth）
; 改完直接 pio run，编译日志会输出 [STEP_SEQ] mode N: ... 自证已生效。
    -DSTEP_SEQ_MODE=1
    ; ^^^ 已恢复。曾短暂切成 0 做 A/B（5b5b431）：想验“铺窗序列超出窗口
    ; 预算、被下一窗中途重编 ARR 而多吐一个边沿”。结果 mode=0 下 diff 仍 +695（原 +714），
    ; 该假设被实测否掉，所以回到默认 mode=1（平滑）。保留下面这段推导作为记录：
    ;   emit() 里 step_ticks = 预算/num_steps，而序列有 num_steps+2 个周期，
    ;   实际总长 ≈ 预算×(n+2)/n；n=1 的窗会超预算 3 倍。虽然它不是本次 +3% 的原因，
    ;   但这个越窗行为是真实存在的，将来查丢步/多发时记得它。
; 以下仅 mode=2 生效：f_h 要对准机械共振峰(Hz)，depth 是速度调制深度(0.05=±5%)。
; 位置纹波≈depth*v/(2*pi*f_h)：1200rpm/180Hz/0.05 → 0.64°。太小没用，太大跟随误差上升。
;    -DSTEP_SEQ_HARMONIC_FREQ_HZ=180.0f
;    -DSTEP_SEQ_HARMONIC_DEPTH=0.05f
; 平滑只铺满窗口预算的千分比，剩下的留给任务调度抖动，避免尾巴被砍造成丢步。
;    -DSTEP_SEQ_SPREAD_PERMILLE=900

;build_src_filter =
;    -<src/**>
;    +<test/main_test_tmcuart.cpp>
;    +<src/at32f403a_407_clock.c>
;    +<src/at32f403a_407_board.c>

extra_scripts = pre:extra_fpu.py

build_type = release    ; or release (default: debug)
middlewares = freertos, usbd_drivers
board_build.freertos_heap = heap_2.c
upload_protocol = dfu          ; USB DFU bootloader
; upload_protocol = stlink       ; ST-Link

; ===== 代码区大小硬限制（这是保险丝，不要删）=====
; 芯片物理容量 256KB，但后半段被 Flash 持久化数据占掉了，固件只能长到 0x0801C000：
;   0x08000000 ~ 0x0801C000  代码区（112KB）  ← 当前用 66KB
;   0x0801C000               负载角拟合元数据（load_angle.h FLASH_META_BASE）
;   0x0801D000               负载角拟合点数据（load_angle.h FLASH_DATA_BASE，1024点×3字=6KB）
;   0x0801F000               编码器校准元数据（angle_encoder.h MAINCAL_META_BASE）
;   0x0801F800               编码器校准主表（angle_encoder.h MAINCAL_FLASH_BASE）
;   0x08020000 ~ 0x08040000  FastCal 稠密表（128KB）
; 不设这个上限，代码长过 112KB 时编译器不会报错，会静默地把
; load_angle 的元数据/拟合点覆盖掉，表现为“校准数据莫名其妙丢失”。
; 112 KB = 114688 = 0x1C000
board_upload.maximum_size = 114688
debug_tool = stlink
monitor_speed = 115200
upload_speed = 921600