; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

;[platformio]
;src_dir = .

[env:genericAT32F403ACCT7]
platform = arterytekat32
board = genericAT32F403ACCT7
framework = at32firmlib
build_flags =
    -DARM_MATH_CM4=1
    -D__FPU_PRESENT=1U
    -Iinclude
    -mcpu=cortex-m4
    -mfpu=fpv4-sp-d16
    -mfloat-abi=hard
    -O3
; 启用printf浮点支持
    -Wl,-u,_printf_float
; 如需scanf读取浮点数再加这一条
; -Wl,-u,_scanf_float

; ===== STEP 脉冲时序（src/closed_loop_controller.cpp 顶部有完整说明）=====
; 0 = 恒速突发（原方案，每窗脉冲挤在窗口开头一波打完）
; 1 = 平滑铺满（本窗步数均匀铺到整窗，降噪主力，无副作用）
; 2 = 平滑 + 谐波注入（在 1 基础上对步频做正弦调频，需先调 f_h/depth）
; 改完直接 pio run，编译日志会输出 [STEP_SEQ] mode N: ... 自证已生效。
    -DSTEP_SEQ_MODE=1
; 以下仅 mode=2 生效：f_h 要对准机械共振峰(Hz)，depth 是速度调制深度(0.05=±5%)。
; 位置纹波≈depth*v/(2*pi*f_h)：1200rpm/180Hz/0.05 → 0.64°。太小没用，太大跟随误差上升。
;    -DSTEP_SEQ_HARMONIC_FREQ_HZ=180.0f
;    -DSTEP_SEQ_HARMONIC_DEPTH=0.05f
; 平滑只铺满窗口预算的千分比，剩下的留给任务调度抖动，避免尾巴被砍造成丢步。
;    -DSTEP_SEQ_SPREAD_PERMILLE=900

;build_src_filter =
;    -<src/**>
;    +<test/main_test_tmcuart.cpp>
;    +<src/at32f403a_407_clock.c>
;    +<src/at32f403a_407_board.c>

extra_scripts = pre:extra_fpu.py

build_type = release    ; or release (default: debug)
middlewares = freertos, usbd_drivers
board_build.freertos_heap = heap_2.c
upload_protocol = dfu          ; USB DFU bootloader
; upload_protocol = stlink       ; ST-Link
debug_tool = stlink
monitor_speed = 115200
upload_speed = 921600