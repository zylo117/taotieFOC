; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

;[platformio]
;src_dir = .

[env:genericAT32F403ACCT7]
platform = arterytekat32
board = genericAT32F403ACCT7
framework = at32firmlib
build_flags =
    -DARM_MATH_CM4=1
    -D__FPU_PRESENT=1U
    ; 【诊断开关】取消注释即可完全绕过磁编码器非线性校准表，
    ; 用来判定“周期性跟随误差”是不是校准表引入的（同一份固件只改这一行）。
    ; -DDISABLE_ENCODER_CALIBRATION_TABLE
    -Iinclude
    -mcpu=cortex-m4
    -mfpu=fpv4-sp-d16
    -mfloat-abi=hard
    -O3
; 启用printf浮点支持
    -Wl,-u,_printf_float
; 如需scanf读取浮点数再加这一条
; -Wl,-u,_scanf_float

; ===== STEP 脉冲时序（src/closed_loop_controller.cpp 顶部有完整说明）=====
; 0 = 恒速突发（原方案，每窗脉冲挤在窗口开头一波打完）
; 1 = 平滑铺满（本窗步数均匀铺到整窗，降噪主力，无副作用）
; 2 = 平滑 + 谐波注入（在 1 基础上对步频做正弦调频，需先调 f_h/depth）
; 改完直接 pio run，编译日志会输出 [STEP_SEQ] mode N: ... 自证已生效。
    -DSTEP_SEQ_MODE=1
    ; ^^^ 已恢复。曾短暂切成 0 做 A/B（5b5b431）：想验“铺窗序列超出窗口
    ; 预算、被下一窗中途重编 ARR 而多吐一个边沿”。结果 mode=0 下 diff 仍 +695（原 +714），
    ; 该假设被实测否掉，所以回到默认 mode=1（平滑）。保留下面这段推导作为记录：
    ;   emit() 里 step_ticks = 预算/num_steps，而序列有 num_steps+2 个周期，
    ;   实际总长 ≈ 预算×(n+2)/n；n=1 的窗会超预算 3 倍。虽然它不是本次 +3% 的原因，
    ;   但这个越窗行为是真实存在的，将来查丢步/多发时记得它。
; 以下仅 mode=2 生效：f_h 要对准机械共振峰(Hz)，depth 是速度调制深度(0.05=±5%)。
; 位置纹波≈depth*v/(2*pi*f_h)：1200rpm/180Hz/0.05 → 0.64°。太小没用，太大跟随误差上升。
;    -DSTEP_SEQ_HARMONIC_FREQ_HZ=180.0f
;    -DSTEP_SEQ_HARMONIC_DEPTH=0.05f
; 平滑只铺满窗口预算的千分比，剩下的留给任务调度抖动，避免尾巴被砍造成丢步。
;    -DSTEP_SEQ_SPREAD_PERMILLE=900

;build_src_filter =
;    -<src/**>
;    +<test/main_test_tmcuart.cpp>
;    +<src/at32f403a_407_clock.c>
;    +<src/at32f403a_407_board.c>

extra_scripts = pre:extra_fpu.py, pre:extra_version.py

build_type = release    ; or release (default: debug)
middlewares = freertos, usbd_drivers
board_build.freertos_heap = heap_2.c

; 【BL 不在应用里】src/bootloader/ 是另一颗固件（[env:bootloader]），必须从应用编译里排除，
; 否则它的 main() 会和应用的 main() 打架。反过来 BL 那边只收这个目录。
build_src_filter = +<*> -<bootloader/>

; ===== 自定义 Bootloader（2026-11-17）=====
; 应用从 0x08002000 起跳，前 8KB 是 bootloader/ 里的自定义 DFU BL，详见 docs/bootloader.md。
; ldscript 走 ${PROJECT_DIR} 绝对路径：pioplatform.py:131 把 board_build.ldscript 直接
; 塞给 LDSCRIPT_PATH，piobuild.py:66 再 env.subst 一次，所以这里必须是能subst成绝对路径的写法。
board_build.ldscript = ${PROJECT_DIR}/bootloader/linker/app_AT32F403AxC_FLASH.ld

; 刷机走自己的脚本：进 DFU（不用按键）→ 下发 → 回读校验 → 复位回应用。
; 不用 upload_protocol = dfu 的原因：那条路径会给 bin 追加 16 字节 DFU suffix，
; 而本项目的镜像是"填满 104KB 应用区 + 末尾 16 字节尾签"的定长格式，
; 再追加 16 字节就会写到 0x0801C000（滞后角元数据）上 —— BL 的地址守卫会一票拒绝。
upload_protocol = custom
; 【必须用 py -3，不能写 python】这台机器的 PATH 上 python 是 Microsoft Store 的
; 空壳别名（WindowsApps\python.exe），执行它既不报错也不干活 —— upload 会静默失败。
; 真正的解释器是 py 启动器指向的 D:\carlcheung\python38（pyserial 3.5 在里面）。
upload_command = py -3 "${PROJECT_DIR}/tools/dfu_flash.py" --bin "${PROJECT_DIR}/.pio/build/genericAT32F403ACCT7/firmware.bin"
; upload_protocol = stlink       ; ST-Link

; ===== 代码区大小硬限制（这是保险丝，不要删）=====
; 芯片物理容量 256KB，但后半段被 Flash 持久化数据占掉了：
;   0x08000000 ~ 0x08001FFF  自定义 Bootloader（8KB）   ← bootloader/ 单独编译
;   0x08002000 ~ 0x0801BFFF  应用代码区（104KB）        ← 当前用 99,720 字节，余 6.6KB
;   0x0801C000               滞后角拟合元数据（lag_angle.h FLASH_META_BASE）
;   0x0801D000               滞后角拟合点数据（lag_angle.h FLASH_DATA_BASE，1024点×3字=6KB）
;   0x0801F000               编码器校准元数据（angle_encoder.h MAINCAL_META_BASE）
;   0x0801F800               编码器校准主表（angle_encoder.h MAINCAL_FLASH_BASE）
;   0x08020000 ~ 0x08040000  FastCal 稠密表（128KB）
; 应用区最后 16 字节（0x0801BFF0）是镜像尾签（magic+长度+CRC32+flags），
; 由 tools/dfu_flash.py 生成、BL 校验通过才跳 —— 所以这个上限一个字节都不能放：
; 代码长过 106,480 字节会直接压到尾签上，BL 就会判定镜像无效而停在 DFU。
; 104 KB = 106496 = 0x1A000
board_upload.maximum_size = 106496
board_upload.offset_address = 0x08002000
debug_tool = stlink
monitor_speed = 115200
upload_speed = 921600

; =============================================================================
; 自定义 Bootloader —— 独立编译产物，8KB，烧一次就再也不用碰（见 docs/bootloader.md）
;
;   pio run -e bootloader                 编译
;   pio run -e bootloader -t size         看体积（必须 ≤ 8192，超了就是分区表要重谈）
;
; 首次烧 BL 仍需人工一次（ST-Link 或按 BOOT0 进芯片内置 DFU），之后所有刷机都不碰按键。
; BL 只依赖 usbd_drivers，不装 FreeRTOS：它唯一的工作是"要么跳应用，要么被 dfu-util 刷"。
; =============================================================================
[env:bootloader]
platform = arterytekat32
board = genericAT32F403ACCT7
framework = at32firmlib
; src_dir 只在 [platformio] 段有效，env 段写了也不生效（实测会去编 src/），
; 所以 BL 源码放在 src/bootloader/ 下，用 build_src_filter 单独收编。
build_src_filter = +<bootloader/>
build_type = release
middlewares = usbd_drivers
extra_scripts = pre:extra_version.py
board_build.ldscript = ${PROJECT_DIR}/bootloader/linker/bl_AT32F403AxC_FLASH.ld
build_flags =
    -Iinclude
    -Isrc/bootloader
    -mcpu=cortex-m4
    ; BL 不用浮点：软浮点省掉 FPU 初始化依赖，也让 -Os 下体积更小
    -mfloat-abi=soft
    -Os
    ; 【不要在这里加 -flto】实测：开了 LTO，AT32 startup 里那些
    ; .weak xxx_IRQHandler → Default_Handler 的弱别名会被 LTO 的符号解析抢先认定，
    ; 本文件里 USBFS_L_CAN1_RX0_IRQHandler 的强定义被丢掉，向量表 word59 直接指向
    ; Default_Handler 死循环 —— 尺寸从 8,216 掉到 4,180 看着很美，实际是 USB 中断
    ; 一进就死、永远枚举不出 DFU 设备，而且编译链接一个警告都没有。
    ; 省下来的 3.5KB 是假的，代价是"刷不进也刷不死"的哑巴砖。
    -fno-asynchronous-unwind-tables
    -fno-unwind-tables
    -fno-exceptions
upload_protocol = custom
upload_command = py -3 "${PROJECT_DIR}/tools/dfu_flash.py" --bin "${PROJECT_DIR}/.pio/build/bootloader/firmware.bin" --bootloader
